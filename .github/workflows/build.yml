name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# contents: write is needed to upload release assets; it is harmless for
# the other triggers, which never write.
permissions:
  contents: write

jobs:
  build:
    # windows-latest is Windows Server 2025 with Visual Studio 2026,
    # matching the local development environment (MSVC v145, C++20).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The preinstalled C:\vcpkg is a shallow clone whose checkout may be
      # older than the pinned builtin-baseline. baseline.json is read from
      # the baseline commit via git, but the versions database and ports are
      # read from the working tree, so fetch the commit AND move the
      # checkout onto it - otherwise ports newer than the image (e.g.
      # libjpeg-turbo 3.2.0) resolve to "no version database entry".
      #
      # The image's vcpkg.exe tracks the image, not our checkout: an updated
      # tool refuses an older tree ("vcpkg-tools.json: document schema
      # version 1 is not supported"). Re-bootstrap after the checkout so the
      # tool version is the one the pinned tree expects.
      - name: Pin vcpkg to the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --depth 1 origin $baseline
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --force $baseline
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Without this, vcpkg rebuilds libjpeg-turbo, wtl and catch2 from
      # source on every run (about a minute each). The key covers what
      # decides the built packages - the manifest, which carries the
      # dependencies and the baseline, and the overlay triplet. A miss only
      # costs the rebuild it would have done anyway.
      - name: Cache the vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-release-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: vcpkg-${{ runner.os }}-release-

      - name: Configure and build (Release)
        shell: cmd
        run: |
          rem Locate the latest Visual Studio with the C++ toolset via vswhere
          rem instead of hardcoding an edition/version path.
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio with C++ tools not found & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          rem CMakePresets.json expects VCPKG_ROOT; the runner image provides
          rem a preinstalled vcpkg via VCPKG_INSTALLATION_ROOT.
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          set "VCPKG_DEFAULT_BINARY_CACHE=%GITHUB_WORKSPACE%\vcpkg-cache"
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          cmake --preset release
          if errorlevel 1 exit /b 1
          cmake --build --preset release

      # turbojpeg.dll is built by the manifest install (x64-chirami overlay
      # triplet: DLL linkage, static CRT) and copied next to the exe by the
      # post-build step, so it is picked straight from the build tree.
      - name: Stage artifact contents
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\licenses
          copy build\release\chirami.exe dist\
          copy README.md dist\
          copy LICENSE dist\
          copy build\release\turbojpeg.dll dist\
          copy build\release\vcpkg_installed\x64-chirami\share\libjpeg-turbo\copyright dist\licenses\libjpeg-turbo.txt

      - uses: actions/upload-artifact@v7
        with:
          name: chirami-win64
          path: dist/
          if-no-files-found: error

      - name: Attach the archive to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $zip = "chirami-$env:TAG_NAME-win64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          gh release upload $env:TAG_NAME $zip --clobber

  # The unit tests live behind the 'tests' manifest feature, so Catch2 is
  # resolved here and never in the release job above.
  tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Same vcpkg pinning as the release job; see the comments there.
      - name: Pin vcpkg to the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --depth 1 origin $baseline
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --force $baseline
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Without this, vcpkg rebuilds libjpeg-turbo, wtl and catch2 from
      # source on every run (about a minute each). The key covers what
      # decides the built packages - the manifest, which carries the
      # dependencies and the baseline, and the overlay triplet. A miss only
      # costs the rebuild it would have done anyway.
      - name: Cache the vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-tests-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: vcpkg-${{ runner.os }}-tests-

      - name: Build and run the tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio with C++ tools not found & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          set "VCPKG_DEFAULT_BINARY_CACHE=%GITHUB_WORKSPACE%\vcpkg-cache"
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          cmake --preset debug-tests
          if errorlevel 1 exit /b 1
          rem Only the test executable; building the app is the release job's
          rem business.
          cmake --build --preset debug-tests --target chirami_tests
          if errorlevel 1 exit /b 1
          ctest --preset debug-tests
